  to = "/services/meeting-rooms/"
  status = 301
[[redirects]]
  from = "/2023/08/29/introverts-and-hot-desking/"
  to = "/services/meeting-rooms/"
  status = 301
[[redirects]]
  from = "/2024/09/13/how-shared-workspaces-drive-business-growth/"
  to = "/services/meeting-rooms/"
  status = 301
[[redirects]]
  from = "/2024/10/22/meeting-spaces-the-hybrid-work-solution/"
