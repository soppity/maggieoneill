# WordPress archive URLs that should not exist on the new site.
[[redirects]]
  from = "/author/*"
  to = "/blog/"
  status = 301
[[redirects]]
  from = "/tag/*"
  to = "/blog/"
  status = 301
[[redirects]]
  from = "/category/*"
  to = "/blog/"
  status = 301

# Old uploads. The privacy policy PDF still earns impressions; /privacy/ is live on the production site.
[[redirects]]
  from = "/wp-content/uploads/2023/01/Privacy-policy.pdf"
  to = "/privacy/"
  status = 301

# Old WordPress sitemaps Google still references (URL Inspection, 12 Oct 2026). The Astro sitemap is /sitemap-index.xml.
[[redirects]]
  from = "/sitemap_index.xml"
  to = "/sitemap-index.xml"
  status = 301
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
[[redirects]]
  from = "/post-sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
[[redirects]]
  from = "/page-sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
[[redirects]]
  from = "/avada_faq-sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

# Old operator licence subdomain. Takes effect once taxi.mobtc.co.uk is added to this Netlify site as a domain alias.
[[redirects]]
  from = "https://taxi.mobtc.co.uk/*"
  to = "https://mobtc.co.uk/operators-licence/"
  status = 301
  force = true

